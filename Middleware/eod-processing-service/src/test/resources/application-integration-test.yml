spring:
  application:
    name: eod-processing-service
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eod-processing-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      transaction-id-prefix: eod-it-tx-
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eod:
  region-order: APAC,EMEA,AMERICAS
  unprocessed-trade-tolerance: 0
  peer:
    business-calendar:
      base-url: http://localhost:18081
      timeout-ms: 1000
      retry-max-attempts: 1
      retry-backoff-ms: 100
    risk-calculation:
      base-url: http://localhost:18082
      timeout-ms: 1000
      retry-max-attempts: 1
      retry-backoff-ms: 100
  topics:
    risk-snapshot: risk-snapshot-completed
    booking-date: booking-date-classified
    eod-completed: eod-completed

logging:
  level:
    com.fxtradeops.eod: DEBUG
