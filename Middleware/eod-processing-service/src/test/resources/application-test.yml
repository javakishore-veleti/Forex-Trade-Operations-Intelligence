spring:
  application:
    name: eod-processing-service
  datasource:
    url: jdbc:h2:mem:eodtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eod-processing-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      transaction-id-prefix: eod-test-tx-
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eod:
  region-order: APAC,EMEA,AMERICAS
  unprocessed-trade-tolerance: 0
  peer:
    business-calendar:
      base-url: http://localhost:18081
      timeout-ms: 1000
      retry-max-attempts: 1
      retry-backoff-ms: 100
    risk-calculation:
      base-url: http://localhost:18082
      timeout-ms: 1000
      retry-max-attempts: 1
      retry-backoff-ms: 100
  topics:
    risk-snapshot: risk-snapshot-completed
    booking-date: booking-date-classified
    eod-completed: eod-completed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fxtradeops.eod: DEBUG
