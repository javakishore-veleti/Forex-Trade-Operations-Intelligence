spring:
  application:
    name: business-calendar-service-test
  datasource:
    url: jdbc:postgresql://localhost:5432/calendar_test_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
