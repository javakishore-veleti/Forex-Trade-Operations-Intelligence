services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fxops-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: fxops-logging
    ports:
      - "9200:9200"
    volumes:
      - fxops-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - fxops-logging-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: fxops-logstash
    ports:
      - "5044:5044"
      # Host 5050 avoids macOS AirPlay Receiver (Control Center) on :5000
      - "5050:5000/tcp"
      - "5050:5000/udp"
    volumes:
      # Only .conf may live under pipeline/ — Logstash parses every file there as config
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash/pipeline/index-template.json:/usr/share/logstash/templates/index-template.json:ro
    networks:
      - fxops-logging-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: fxops-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: fxops-kibana
    ports:
      - "5601:5601"
    volumes:
      - ./kibana/saved-objects:/usr/share/kibana/saved-objects:ro
      - ./kibana/index-patterns:/usr/share/kibana/index-patterns:ro
    networks:
      - fxops-logging-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  fxops-elasticsearch-data:

networks:
  fxops-logging-net:
    driver: bridge
