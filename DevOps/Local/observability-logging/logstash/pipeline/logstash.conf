input {
  # TCP input for JSON structured logs from services
  tcp {
    port => 5000
    codec => json_lines
    tags => ["service"]
  }

  # Beats input for file-based log shipping
  beats {
    port => 5044
    tags => ["filebeat"]
  }
}

filter {
  # Parse JSON structured logs — do NOT apply grok to already-structured fields
  if [message] and ![timestamp] {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    if [parsed] {
      mutate {
        rename => {
          "[parsed][timestamp]" => "timestamp"
          "[parsed][level]" => "level"
          "[parsed][service]" => "service"
          "[parsed][traceId]" => "traceId"
          "[parsed][spanId]" => "spanId"
          "[parsed][correlationId]" => "correlationId"
          "[parsed][tradeId]" => "tradeId"
          "[parsed][regionCode]" => "regionCode"
          "[parsed][message]" => "log_message"
          "[parsed][logger]" => "logger"
          "[parsed][exception]" => "exception"
        }
        remove_field => ["parsed"]
      }
    }
  }

  # Add environment field for multi-environment filtering
  mutate {
    add_field => { "environment" => "local" }
  }

  # Parse timestamp field to @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Route Kafka broker logs to separate index
  if [container_name] =~ /kafka/ or [service] == "kafka" {
    mutate {
      add_tag => ["kafka"]
      replace => { "[@metadata][target_index]" => "fxops-kafka-%{+YYYY.MM.dd}" }
    }
  } else {
    mutate {
      replace => { "[@metadata][target_index]" => "fxops-services-%{+YYYY.MM.dd}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    manage_template => true
    template_name => "fxops-logs"
    template_overwrite => true
    template => "/usr/share/logstash/templates/index-template.json"
  }
}
