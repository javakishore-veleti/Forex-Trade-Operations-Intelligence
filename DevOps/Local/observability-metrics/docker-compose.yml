services:
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: fxops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - fxops-prometheus-data:/prometheus
    networks:
      - fxops-metrics-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fxops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: fxops
      GF_SECURITY_ADMIN_PASSWORD: fxops_local_dev
    ports:
      - "3000:3000"
    volumes:
      - fxops-grafana-data:/var/lib/grafana
    networks:
      - fxops-metrics-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fxops-prometheus-data:
  fxops-grafana-data:

networks:
  fxops-metrics-net:
    driver: bridge
