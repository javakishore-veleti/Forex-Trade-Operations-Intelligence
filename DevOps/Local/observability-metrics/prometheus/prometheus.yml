global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/alert-rules.yml"

scrape_configs:
  # --- Service Jobs (15s interval) ---

  - job_name: "trade-ingest-service"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["trade-ingest-service:8080"]
        labels:
          service: "trade-ingest-service"

  - job_name: "trade-lifecycle-service"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["trade-lifecycle-service:8081"]
        labels:
          service: "trade-lifecycle-service"

  - job_name: "risk-calculation-service"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["risk-calculation-service:8082"]
        labels:
          service: "risk-calculation-service"

  - job_name: "eod-processing-service"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eod-processing-service:8083"]
        labels:
          service: "eod-processing-service"

  - job_name: "business-calendar-service"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["business-calendar-service:8084"]
        labels:
          service: "business-calendar-service"

  - job_name: "state-reconciliation-service"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["state-reconciliation-service:8085"]
        labels:
          service: "state-reconciliation-service"

  - job_name: "event-sequence-processor"
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-sequence-processor:8086"]
        labels:
          service: "event-sequence-processor"

  # --- Infrastructure Jobs (30s interval) ---

  - job_name: "kafka-jmx"
    scrape_interval: 30s
    static_configs:
      - targets: ["kafka:9101"]
        labels:
          service: "kafka"

  - job_name: "otel-collector"
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: "otel-collector"
