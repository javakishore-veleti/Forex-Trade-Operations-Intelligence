services:
  neo4j:
    image: neo4j:5.23
    container_name: fxops-neo4j
    environment:
      NEO4J_AUTH: neo4j/fxops_local_dev
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - fxops-neo4j-data:/data
    networks:
      - fxops-graph-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fxops-neo4j-data:

networks:
  fxops-graph-net:
    driver: bridge
