# =============================================================================
# FXOps — eod-processing-service Helm Values
# End-of-day batch processing, settlement calculations
# =============================================================================

replicaCount: 2

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/fxops/eod-processing-service"
  tag: "latest"

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/fxops-eod-processing-dev"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "3Gi"

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  # --- Database (RDS via Proxy) ---
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://${RDS_PROXY_ENDPOINT}:5432/fxops?sslmode=require&sslrootcert=/etc/ssl/rds-ca.pem"
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: "15"
  # --- Kafka (MSK) ---
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "${MSK_BOOTSTRAP_BROKERS}:9098"
  - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
    value: "SASL_SSL"
  - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
    value: "AWS_MSK_IAM"
  - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
    value: "software.amazon.msk.auth.iam.IAMLoginModule required;"
  - name: SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS
    value: "software.amazon.msk.auth.iam.IAMClientCallbackHandler"
  # --- OTel ---
  - name: OTEL_SERVICE_NAME
    value: "eod-processing-service"

initContainers:
  - name: flyway-migrate
    image: "123456789012.dkr.ecr.us-east-1.amazonaws.com/fxops/flyway:10"
    command: ["flyway", "migrate"]
    env:
      - name: FLYWAY_URL
        value: "jdbc:postgresql://${RDS_PROXY_ENDPOINT}:5432/fxops?sslmode=require"
      - name: FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - name: FLYWAY_SCHEMAS
        value: "eod_processing"

volumeMounts:
  - name: rds-ca-cert
    mountPath: /etc/ssl/rds-ca.pem
    subPath: rds-ca.pem
    readOnly: true

volumes:
  - name: rds-ca-cert
    configMap:
      name: rds-ca-bundle
